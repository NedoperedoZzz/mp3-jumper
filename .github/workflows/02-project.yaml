name: "Project CI - Generate Demo Mix"
on:
  workflow_dispatch:

jobs:
  generate-artifact:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/oguzhan-yilmaz/pycrossfade:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies (без pycrossfade)
        run: |
          pip install -r requirements.txt

      - name: Create Test Audio
        run: |
          ffmpeg -f lavfi -i "sine=frequency=440:duration=10" -c:a libmp3lame test1.mp3
          ffmpeg -f lavfi -i "sine=frequency=554:duration=10" -c:a libmp3lame test2.mp3

      - name: Run Merge with pyCrossfade
        run: |
          python -c "
from pathlib import Path
from app.audio import merge_audio
merge_audio([Path('test1.mp3'), Path('test2.mp3')], Path('demo_mix.mp3'))
"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-mix-result
          path: demo_mix.mp3