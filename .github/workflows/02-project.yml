name: "Project CI - Generate Demo Mix"

on:
  workflow_dispatch: # Только ручной запуск

jobs:
  generate-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 rubberband-cli

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Test Audio
        run: |
          echo "=========================================================="
          echo "[PROJECT CI] Что делаем: Генерация трех тестовых аудиофайлов"
          echo "[PROJECT CI] Как делаем: ffmpeg -f lavfi -i sine=..."
          echo "[PROJECT CI] Зачем: Чтобы продемонстрировать склейку без хранения бинарных файлов в Git"
          echo "=========================================================="
          ffmpeg -f lavfi -i "sine=frequency=440:duration=10" -c:a libmp3lame test1.mp3
          ffmpeg -f lavfi -i "sine=frequency=554:duration=10" -c:a libmp3lame test2.mp3
          ffmpeg -f lavfi -i "sine=frequency=659:duration=10" -c:a libmp3lame test3.mp3
          echo "[PROJECT CI] Тестовые файлы успешно созданы."

      - name: Run App Logic to Merge Audio
        run: |
          echo "=========================================================="
          echo "[PROJECT CI] Что делаем: Склейка аудиофайлов с кроссфейдом"
          echo "[PROJECT CI] Как делаем: Вызов функции merge_audio из app/audio.py"
          echo "[PROJECT CI] Зачем: Проверка реальной работоспособности бэкенда проекта"
          echo "=========================================================="
          python -c "
          from pathlib import Path
          from app.audio import merge_audio
          files = [Path('test1.mp3'), Path('test2.mp3'), Path('test3.mp3')]
          merge_audio(files, Path('demo_mix.mp3'))
          "
          echo "[PROJECT CI] Склейка завершена успешно."

      - name: Verify Result
        run: |
          echo "[PROJECT CI] Проверка созданного артефакта:"
          ls -lh demo_mix.mp3
          test -s demo_mix.mp3
          echo "[PROJECT CI] Файл demo_mix.mp3 существует и не пуст."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-mix-result
          path: demo_mix.mp3
          retention-days: 7