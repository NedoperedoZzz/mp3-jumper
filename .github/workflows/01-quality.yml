name: "Quality CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for pyCrossfade
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 rubberband-cli ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          echo "=========================================================="
          echo "[QUALITY] Что проверяем: Статический анализ кода (Ruff)"
          echo "[QUALITY] Как проверяем: ruff check . && ruff format --check ."
          echo "[QUALITY] Зачем: Проверка стиля, синтаксиса и отсутствия неиспользуемых импортов"
          echo "=========================================================="
          ruff check .
          ruff format --check .
          echo "[QUALITY] Результат: PASS (Код соответствует стандартам)"

      - name: Run Tests with Pytest
        run: |
          echo "=========================================================="
          echo "[QUALITY] Что проверяем: Функциональная логика бэкенда"
          echo "[QUALITY] Как проверяем: pytest tests/ -v"
          echo "[QUALITY] Зачем: Проверка fallback-логики FFmpeg, обработки ошибок pycrossfade и парсинга ответов LLM"
          echo "=========================================================="
          pytest tests/ -v
          echo "[QUALITY] Результат: PASS (Все юнит-тесты успешно пройдены)"