name: "Quality CI"
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for pyCrossfade
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 rubberband-cli ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          echo "[QUALITY] Проверка стиля кода и типизации (Ruff)..."
          ruff check .
          ruff format --check .

      - name: Run Tests with Pytest
        run: |
          echo "[QUALITY] Запуск юнит-тестов логики проекта..."
          pytest tests/ -v