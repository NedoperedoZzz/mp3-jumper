name: "Deploy Static Site to GitHub Pages"

on:
  push:
    branches: [ main, master ]
    paths:
      - 'static/**'  # Запускается только при изменениях в папке static
  workflow_dispatch: # Можно запустить и вручную

# Устанавливаем необходимые разрешения для деплоя на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Позволяем одновременно выполняться только одному деплою
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Указываем, какую именно папку нужно опубликовать
          path: './static'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4