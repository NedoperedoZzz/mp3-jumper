name: 01 - Quality CI

# На каждый push в master и при ручном запуске.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  quality:
    name: Анализ качества и проверки
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить инструменты проверки
        run: python -m pip install -r requirements-dev.txt

      # Выполняем все проверки до конца и возвращаем ненулевой код,
      # если хотя бы одна проверка обнаружила проблему.
      - name: Quality gate
        run: python scripts/quality_gate.py

      - name: Сохранить отчет, даже при неудаче
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality.json
          if-no-files-found: warn
          retention-days: 7
