name: 02 - Project CI

# Ручной запуск: бережем лимит раннеров в учебной организации.
# Студент может изменить способ запуска, обосновав необходимость.
on:
  workflow_dispatch:

jobs:
  produce:
    name: Создать полезный результат
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # TODO: замените демонстрационный сценарий своим проектом.
      - name: Выполнить пример из шаблона
        run: python -m src.project_demo --input data/sample.csv --output dist

      - name: Сохранить результат первого job
        uses: actions/upload-artifact@v4
        with:
          name: project-result
          path: dist/
          if-no-files-found: error
          retention-days: 7

  consume:
    name: Использовать результат в другом job
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Получить артефакт первого job
        uses: actions/download-artifact@v4
        with:
          name: project-result
          path: received/

      # TODO: замените проверку демонстрационного артефакта
      # содержательным использованием результата вашего проекта.
      - name: Прочитать и проверить результат
        run: python scripts/verify_result.py received/
