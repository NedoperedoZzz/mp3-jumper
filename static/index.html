<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixMaster</title>
    <!-- Пути ОТНОСИТЕЛЬНЫЕ: на GitHub Pages сайт лежит в /<repo>/, абсолютный /static/ там отдаёт 404 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>MixMaster 🎵</h1>
        <p>Загрузите MP3-файлы и перетащите их в нужном порядке.</p>
        <!-- Статус бэкенда: страница на GitHub Pages без API — это витрина -->
        <div id="backendStatus" class="backend-status backend-status--checking">
            Проверяю соединение с бэкендом…
        </div>

                <!-- Скрываем нативный инпут и делаем красивую кнопку -->
        <input type="file" id="fileInput" multiple accept=".mp3" style="display: none;">
        <label for="fileInput" class="custom-file-upload">
            + Добавить MP3 файлы
        </label>
        <ul id="fileList" class="drag-list"></ul>

        <div class="options">
            <label>
                <input type="checkbox" id="smartMode">
                <b>Умные переходы (плавные кроссфейды, кодирование на вашем устройстве)</b> <span style="color:#888; font-size:12px;">(обработка тяжелая, может вызвать отвал сайта)</span>
            </label>
        </div>

        <button id="mergeBtn" disabled>Объединить в микс</button>

        <!-- Прогресс-бар -->
        <div id="progressContainer" style="display:none;">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p id="progressText">Идет обработка. Пожалуйста, подождите...</p>
        </div>

        <div id="resultSection" style="display:none;">
            <h2>Ваш микс готов!</h2>
            <audio id="audioPlayer" controls></audio>

            <div id="timestamps">
                <h3>Тайм-коды треков:</h3>
                <ul id="tsList" style="list-style: none; padding: 0; margin: 0;"></ul>
            </div>

            <div class="title-gen">
                <input type="text" id="mixTitle" value="my_mix" placeholder="Название микса">
                <button id="generateTitleBtn">✨ Сгенерировать ИИ</button>
            </div>

            <button id="downloadBtn">Скачать MP3</button>
            <button id="resetBtn" class="reset-btn" style="display: block; margin-top: 15px; background: #444; color: white;">Создать новый микс</button>
        </div>
    </div>
    <!-- Адрес бэкенда (FastAPI). GitHub Pages хостит только статику, поэтому на Pages тут должен быть URL запущенного API.
         Пустая строка = тот же источник (локальный `uvicorn app.main:app`). -->
    <script>
        // Пусто = бэкенд там же, где страница (локальный uvicorn).
        // Для сайта на GitHub Pages сюда вставляется адрес FastAPI, выложенного
        // на Render/Fly (см. docs/BACKEND.md) и разрешённого в ALLOWED_ORIGINS:
        //   window.MP3_API_BASE = "https://mp3-jumper.onrender.com";
        window.MP3_API_BASE = "";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <script src="lame.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
